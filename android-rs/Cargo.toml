[package]
name = "korean-grammar"
version = "2.0.0"
edition = "2021"
rust-version = "1.85"
description = "한국어 문법 - aplikasi belajar tata bahasa Korea, ditulis murni dengan Rust"
license = "MIT"

# Di Android crate ini harus cdylib (dimuat Activity native).
# rlib dipakai supaya contoh desktop bisa memakainya.
[lib]
name = "korean_grammar"
crate-type = ["cdylib", "rlib"]

[dependencies]
eframe = { version = "0.37", default-features = false, features = [
    "glow",
    "default_fonts",
    "android-native-activity",
] }
egui = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "android")'.dependencies]
winit = "0.30"
android_logger = "0.15"
log = "0.4"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# ---------------------------------------------------------------- Android
[package.metadata.android]
package = "com.rifqilubis.koreangrammar"
apk_name = "korean-grammar-rust"
build_targets = [
    "aarch64-linux-android",
    "armv7-linux-androideabi",
    "i686-linux-android",
    "x86_64-linux-android",
]
# Materi (data.json) dan huruf Korea ditanam lewat `include_bytes!`, jadi
# tidak ada berkas aset yang perlu ikut ke dalam APK.
resources = "res"

[package.metadata.android.sdk]
min_sdk_version = 24
target_sdk_version = 34

[package.metadata.android.application]
label = "한국어 문법"
icon = "@mipmap/ic_launcher"
