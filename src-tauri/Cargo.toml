[package]
name = "korean-grammar"
version = "1.0.0"
description = "Belajar tata bahasa Korea untuk pemula"
authors = ["Rifqi Lubis"]
edition = "2021"
rust-version = "1.77.2"
license = "MIT"
repository = "https://github.com/rifqilubis/korean-grammar"
default-run = "korean-grammar"

# Nama library dipakai oleh entry point Android/iOS (lihat src/lib.rs).
[lib]
name = "korean_grammar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-tts = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
